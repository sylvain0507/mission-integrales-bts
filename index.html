<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#eaf0f8;background:#0c192b;font-size:16px;--muted:#abbcd0;--line:#31435b;--mint:#6ee7c7;--orange:#ffc587}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,.button{border:1px solid var(--line);border-radius:9px;background:#233751;color:#fff;padding:12px 18px;cursor:pointer;display:inline-block;text-decoration:none;font-weight:600}button:hover,.button:hover{background:#304c6a}button.primary,.button.primary{background:var(--mint);color:#102638;border-color:var(--mint)}button:disabled{opacity:.45;cursor:default}button.quiet{background:transparent}a{color:var(--mint)}input,textarea,select{background:#0c192b;color:#fff;border:1px solid #6a809c;border-radius:7px;padding:11px;width:100%}textarea{min-height:90px;resize:vertical}label{display:block;margin:15px 0 7px}input[type=radio]{width:auto;accent-color:var(--mint)}:focus-visible{outline:3px solid #ffcb85;outline-offset:4px}header{border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px max(24px,calc((100vw - 1200px)/2));background:#0a1525}.brand{font-size:1.05rem;font-weight:750;letter-spacing:.06em}.brand span{color:var(--mint)}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{font-size:.9rem;padding:8px 12px}main{max-width:1200px;margin:auto;padding:35px 24px 70px}h1{font-size:clamp(2rem,4vw,3.8rem);line-height:1.08;margin:15px 0 22px;font-weight:720;letter-spacing:-.035em}h2{font-size:1.5rem;margin:0 0 18px}h3{font-size:1.05rem}p{line-height:1.65}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:.85rem;font-weight:700;color:var(--mint)}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:25px;align-items:start}.card{background:#14253b;border:1px solid var(--line);border-radius:16px;padding:25px;margin-bottom:20px}.hero{padding:20px 20px 15px 0}.tag{display:inline-block;color:var(--mint);border:1px solid #3b6a69;border-radius:30px;padding:6px 12px;font-size:.85rem;margin-right:7px;margin-bottom:7px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:0 1 auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.wide{width:100%}.small{font-size:.88rem}.notice{border-left:3px solid var(--orange);background:#263347;padding:13px 17px;line-height:1.6;border-radius:5px}.good{border-color:var(--mint);background:#173d3d}.score{font-size:2.3rem;font-weight:750;color:var(--mint)}.stat{padding:16px;border:1px solid var(--line);border-radius:10px;min-width:130px}.stat strong{display:block;font-size:1.6rem}.game{display:grid;grid-template-columns:250px 1fr;gap:25px}.rail button{display:block;width:100%;text-align:left;margin:9px 0;font-size:.92rem}.rail .active{border-color:var(--mint);background:#214841}.progress{height:8px;background:#2c3b50;border-radius:9px;overflow:hidden;margin:12px 0 20px}.progress div{height:100%;background:var(--mint)}.question{font-size:1.2rem;font-weight:650;line-height:1.6}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);padding:14px;border-radius:9px;margin:10px 0;font-weight:400;line-height:1.5;cursor:pointer}.option input{margin-top:5px}.option:has(input:checked){border-color:var(--mint);background:#193e40}.signal{color:var(--muted);background:#0e1e32;border-radius:10px;margin:20px 0}.signal svg{width:100%;display:block}.signal figcaption{padding:0 15px 12px;font-size:.85rem}.feedback{margin-top:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}.scroll{overflow-x:auto}code{font:inherit;font-family:Consolas,monospace;overflow-wrap:anywhere;color:#e5dcad}.error{color:#ffcbac}#status{position:fixed;bottom:15px;left:20px;right:20px;max-width:760px;background:#34445c;padding:15px 20px;border-radius:9px;z-index:5;box-shadow:0 5px 30px #0007}#status:empty{display:none}.spark{display:flex;align-items:end;gap:5px;height:75px}.spark i{display:block;min-width:20px;max-width:42px;background:var(--mint);border-radius:4px 4px 0 0}.separator{border:0;border-top:1px solid var(--line);margin:22px 0}details{margin:12px 0}summary{cursor:pointer;line-height:1.6}footer{border-top:1px solid var(--line);padding:20px 24px;text-align:center;color:var(--muted);font-size:.85rem}ol,ul{line-height:1.8}.circuit{height:145px;margin:30px 0;color:var(--mint)}.circuit svg{width:100%;height:100%}.pill{border-radius:7px;background:#24394f;padding:4px 8px;font-size:.85rem}@media(max-width:800px){.grid,.game{grid-template-columns:1fr}.rail{display:flex;flex-wrap:wrap;gap:6px}.rail h2,.rail .progress{width:100%}.rail button{width:auto;flex:1 1 130px}.hero{padding:0}header{align-items:flex-start;flex-direction:column}.two{grid-template-columns:1fr}.card{padding:19px}main{padding:24px 16px}h1{font-size:2.5rem}}@media print{header,footer,button,.button,#status,.no-print{display:none!important}body{background:white;color:#111}main{max-width:none;padding:0}.card{border:1px solid #aaa;background:white;break-inside:avoid}.muted,.eyebrow,a,.score,code{color:#222}.grid,.game{display:block}.notice{background:white}.scroll{overflow:visible}}
math{font-family:"Cambria Math","STIX Two Math",serif;font-size:1.12em;margin-inline:.08em;vertical-align:middle} .question math{font-size:1.14em} .option math{font-size:1.08em}</style></head><body><header><div class="brand">MISSION <span>∫</span> INTÉGRALES <small> / BTS</small></div><nav aria-label="Navigation principale"><button onclick="home()">Accueil</button><button onclick="teacher()">Espace enseignant</button><button onclick="guide()">Mode d’emploi</button></nav></header><main id="app"></main><div id="status" role="status" aria-live="polite"></div><footer>Atelier électrique · Primitives & intégrales · Modèles idéalisés · Calculatrice autorisée</footer>
<script>
/* Moteur pédagogique partagé par le navigateur et le serveur. */
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function fmt(x){return Number(x.toFixed(3)).toLocaleString('fr-FR',{maximumFractionDigits:3});}
function missions(level,seed){const r=rng(seed),pick=a=>a[Math.floor(r()*a.length)],a=pick([2,4,6]),b=pick([2,3,4]),T=pick([2,3,4]),U=pick([12,24,48]),I=pick([2,3,4]),tau=pick([2,4,5]),C=pick([2,3,5]),w=pick([2,4,10]);
const make=(title,skill,context,question,unit,answer,reason,wrong,hints,solution,shape)=>({title,skill,context,question,unit,answer,options:[reason,...wrong],hints,solution,shape});
if(level===1)return[
 make('Réétalonner le capteur','Primitives polynomiales',`Le capteur mesure un courant i(t) = ${a}t + ${b} A. Le temps t est exprimé en secondes. On cherche une primitive F(t) = At² + Bt + K de i.`,`Quel est le coefficient A ?`,'',a/2,`La dérivée de At² est 2At, donc 2A = ${a}.`,[`On conserve le coefficient de t, donc A = ${a}.`,`On dérive i(t), donc A = ${a}.`],['Une primitive se vérifie en la dérivant.','La dérivée de t² est 2t.'],`F(t) = ${a/2}t² + ${b}t + K. En dérivant : F′(t) = ${a}t + ${b} = i(t). K est une constante arbitraire.`,{kind:'line',a,b,T}),
 make('Initialiser le compteur','Condition initiale',`La charge q vérifie q′(t) = ${a}t + ${b} et q(0) = ${C} C. t est en s ; q est en coulombs.`,`Calculer q(${T}).`,'C',a*T*T/2+b*T+C,`On intègre q′ puis on utilise q(0) = ${C} pour fixer la constante.`,['La charge est égale au courant instantané.','La constante d’intégration vaut toujours zéro.'],['Écrire q(t) = une primitive de q′(t) + K.',`À t = 0, il reste seulement K : K = ${C}.`],`q(t) = ${a/2}t² + ${b}t + ${C}. Donc q(${T}) = ${a/2} × ${T}² + ${b} × ${T} + ${C} = ${fmt(a*T*T/2+b*T+C)} C.`,{kind:'line',a,b,T}),
 make('Charger la batterie','Intégrale et charge',`Pendant ${T} s, le courant vaut i(t) = ${a}t + ${b} A. On calcule la charge transférée pendant cet intervalle, sans charge initiale à ajouter.`,`Calculer Q = ∫ de 0 à ${T} de i(t) dt.`,'C',a*T*T/2+b*T,`Q = F(${T}) − F(0), où F′ = i.`,['Q est uniquement la valeur du courant à la fin.','Il faut soustraire les dérivées aux bornes.'],['La charge transférée est l’intégrale du courant.',`Une primitive est F(t) = ${a/2}t² + ${b}t.`],`Q = [${a/2}t² + ${b}t] de 0 à ${T} = ${a/2} × ${T}² + ${b} × ${T} = ${fmt(a*T*T/2+b*T)} C. L’unité A·s est le coulomb.`,{kind:'line',a,b,T}),
 make('Mesurer l’énergie','Intégrale et énergie',`Une alimentation délivre une tension constante U = ${U} V et un courant i(t) = ${a}t + ${b} A pendant ${T} s. Le modèle est idéal.`,`Calculer l’énergie E = ∫ de 0 à ${T} de U·i(t) dt.`,'J',U*(a*T*T/2+b*T),`U est constante : E = U × ∫ i(t) dt.`,['Il faut multiplier seulement U par le courant final.','Le produit U × i est déjà une énergie.'],['La puissance vaut p(t) = U·i(t), en watts.','Intégrer la puissance sur la durée donne l’énergie, en joules.'],`E = ${U} × [${a/2}t² + ${b}t] de 0 à ${T} = ${fmt(U*(a*T*T/2+b*T))} J. Vérification : V·A·s = W·s = J.`,{kind:'line',a:a*U,b:b*U,T}),
 make('Régler le courant moyen','Valeur moyenne',`Sur [0 ; ${T}] s, le courant est i(t) = ${a}t + ${b} A. Un courant constant équivalent doit transférer la même charge.`,`Calculer la valeur moyenne de i.`,'A',a*T/2+b,`La moyenne vaut (1/${T}) × ∫ de 0 à ${T} de i(t) dt.`,['La moyenne est toujours la valeur maximale.','Il suffit d’intégrer, sans diviser par la durée.'],['Pour une fonction f sur [u ; v], moyenne = intégrale / (v − u).','Ici, diviser la charge transférée par la durée.'],`I_moy = (1/${T}) × (${a/2} × ${T}² + ${b} × ${T}) = ${fmt(a*T/2+b)} A. Pour ce courant affine, cela coïncide avec la moyenne des valeurs aux deux bornes.`,{kind:'line',a,b,T}),
 make('Valider le cycle','Intégrale par morceaux',`Le courant vaut ${I} A de 0 à 2 s, puis ${I+2} A de 2 à 5 s. La commutation instantanée est idéalisée.`,`Calculer la charge transférée entre 0 et 5 s.`,'C',2*I+3*(I+2),`On additionne les charges : ${I} × 2 + ${I+2} × 3.`,['Chaque palier dure 5 s.','La charge est la somme des intensités, sans durée.'],['Découper l’intégrale au changement de courant.','L’aire d’un rectangle vaut courant × durée.'],`Q = ∫₀² ${I} dt + ∫₂⁵ ${I+2} dt = ${I} × 2 + ${I+2} × (5 − 2) = ${fmt(2*I+3*(I+2))} C. La valeur au seul instant t = 2 ne change pas l’intégrale.`,{kind:'step',a:I,b:I+2,T:5})
];
return[
 make('Suivre la décharge','Exponentielle composée',`Dans un circuit RC idéalisé, i(t) = ${I}e^(−t/${tau}) A. La constante de temps vaut ${tau} s. Une primitive s’écrit F(t) = A e^(−t/${tau}) + K.`,`Déterminer le coefficient A.`,'',-I*tau,`La dérivée de A e^(−t/${tau}) est (−A/${tau})e^(−t/${tau}).`,['Le coefficient de la primitive est égal à celui de la fonction.','Il faut multiplier par −1/τ au lieu de diviser par −1/τ.'],['La dérivation d’une exponentielle composée fait apparaître le coefficient de t.',`Il faut −A/${tau} = ${I}.`],`F′(t) = −A/${tau} × e^(−t/${tau}). Pour obtenir ${I}e^(−t/${tau}), A = −${I*tau}. Donc F(t) = −${I*tau}e^(−t/${tau}) + K.`,{kind:'exp',a:I,tau,T:tau*2}),
 make('Quantifier la décharge','Intégrale exponentielle',`Le courant de décharge est i(t) = ${I}e^(−t/${tau}) A sur [0 ; ${tau*2}] s.`,`Calculer la charge transférée Q. Arrondir au millième.`,'C',I*tau*(1-Math.exp(-2)),`Q = ${I*tau}(1 − e^(−2)), après évaluation d’une primitive aux bornes.`,['Q est égale au courant final multiplié par la durée.','Une primitive de e^(−t/τ) est e^(−t/τ), sans coefficient.'],['Une primitive de i(t) est −I₀τ e^(−t/τ).','À t = 0, l’exponentielle vaut 1.'],`Q = [−${I*tau}e^(−t/${tau})] de 0 à ${tau*2} = −${I*tau}e^(−2) + ${I*tau} = ${fmt(I*tau*(1-Math.exp(-2)))} C. Le résultat est positif, inférieur à la charge limite I₀τ = ${I*tau} C.`,{kind:'exp',a:I,tau,T:tau*2}),
 make('Analyser une régulation','Primitive logarithmique',`Un régulateur produit i(t) = ${a}/(t + 1) A pour t entre 0 et ${T} s. Le modèle utilise la valeur numérique de t exprimée en secondes ; t + 1 est positif.`,`Calculer Q = ∫ de 0 à ${T} de i(t) dt. Arrondir au millième.`,'C',a*Math.log(T+1),`Une primitive est ${a} ln(t + 1), car (ln(t + 1))′ = 1/(t + 1).`,['La primitive de 1/(t + 1) est 1/(t + 1)².','Il faut remplacer ln(t + 1) par ln(t).'],['Reconnaître la forme u′/u.','ln(1) = 0. La constante d’intégration disparaît dans la différence.'],`Q = [${a} ln(t + 1)] de 0 à ${T} = ${a}(ln(${T+1}) − ln(1)) = ${fmt(a*Math.log(T+1))} C.`,{kind:'log',a,T}),
 make('Redresser le signal','Intégrale trigonométrique',`Un courant vaut i(t) = ${I} sin(${w}t) A pendant la demi-période [0 ; π/${w}] s. L’argument du sinus est en radians. Le courant est positif sur cet intervalle.`,`Calculer la charge transférée. Arrondir au millième.`,'C',2*I/w,`Une primitive est −(${I}/${w}) cos(${w}t) ; cos(π) = −1 et cos(0) = 1.`,['La charge est nulle comme sur une période entière.','Une primitive de sin(ωt) est cos(ωt) sans coefficient ni signe.'],['Une primitive de sin(ωt) est −cos(ωt)/ω.','Ne pas confondre demi-période et période entière.'],`Q = [−${I}/${w} cos(${w}t)] de 0 à π/${w} = ${I}/${w} + ${I}/${w} = ${fmt(2*I/w)} C. Sur une période entière, la charge algébrique serait nulle.`,{kind:'sine',a:I,w,T:Math.PI/w}),
 make('Dimensionner la résistance','Valeur efficace',`Le courant est i(t) = ${I} sin(${w}t) A sur une période T = 2π/${w} s. On admet sin²(x) = (1 − cos(2x))/2.`,`Calculer I_eff = √[(1/T) ∫ de 0 à T de i²(t) dt]. Arrondir au millième.`,'A',I/Math.sqrt(2),`La moyenne de sin² sur une période est 1/2 : I_eff = ${I}/√2.`,['La valeur efficace est nulle car la moyenne de sin est nulle.','Il faut prendre la moyenne de i, puis l’élever au carré.'],['Élever le courant au carré avant d’intégrer.','Sur une période, l’intégrale du terme cosinus de l’identité est nulle.'],`i²(t) = ${I*I}(1 − cos(${2*w}t))/2. Son intégrale sur une période vaut ${I*I}T/2. Donc I_eff² = ${I*I}/2, puis I_eff = ${I}/√2 = ${fmt(I/Math.sqrt(2))} A. Moyenne et valeur efficace sont différentes.`,{kind:'sine',a:I,w,T:2*Math.PI/w}),
 make('Auditer l’énergie stockée','Énergie et exponentielle',`Un condensateur de capacité C = ${C} mF est chargé par u(t) = ${U}(1 − e^(−t/${tau})) V. Le courant est i(t) = C·u′(t). On évalue l’énergie reçue entre 0 et ${tau} s.`,`Calculer E = ∫ de 0 à ${tau} de u(t)·i(t) dt, en joules. Arrondir au millième.`,'J',0.5*C/1000*U*U*(1-Math.exp(-1))**2,`Puisque i = C·u′, une primitive de u·i est C·u²/2, avec C en farads.`,['Il faut utiliser directement la capacité en mF dans la formule en joules.','L’énergie est égale à C·u, qui représente une charge.'],['Reconnaître (u²)′ = 2u·u′.',`Convertir ${C} mF en ${fmt(C/1000)} F. À t = τ, u = ${U}(1 − e^(−1)).`],`E = [C·u²/2] de 0 à ${tau}, car (C·u²/2)′ = C·u·u′ = u·i. u(0) = 0 et u(${tau}) = ${U}(1 − e^(−1)) V. Avec C = ${C/1000} F, E = (${C/1000}/2) × [${U}(1 − e^(−1))]² = ${fmt(0.5*C/1000*U*U*(1-Math.exp(-1))**2)} J.`,{kind:'charge',a:U,tau,T:tau})
];}
function numberInput(s){s=String(s).trim().replace(/\u00a0|\u202f| /g,'').replace(',','.');return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(s)?Number(s):NaN;}
function closeAnswer(v,a){return Number.isFinite(v)&&Math.abs(v-a)<=0.005;}
function missionScore(rec){if(rec.revealed)return 0;return Math.max(0,(rec.numeric?6:0)+(rec.reason?4:0)-2*rec.hints-Math.min(rec.errors,2));}
function freshRecord(){return{hints:0,errors:0,tries:0,numeric:false,reason:false,done:false,revealed:false,value:'',choice:-1,work:''};}
function mark(s){return Math.round(s.records.reduce((n,r)=>n+(r.done?missionScore(r):0),0)/3*100)/100;}
function progress(s){return s.records.filter(r=>r.done).length;}
function newSession(level,seed,id){return{id,level,seed,index:0,records:Array.from({length:6},freshRecord),started:new Date().toISOString(),updated:new Date().toISOString()};}
function act(s,action){const rec=s.records[s.index],m=missions(s.level,s.seed)[s.index];if(rec.done)throw Error('Mission déjà terminée.');
if(action.type==='hint'){rec.hints=Math.min(2,rec.hints+1);}
else if(action.type==='reveal'){rec.revealed=true;rec.done=true;}
else if(action.type==='answer'){const val=numberInput(action.value);if(!Number.isFinite(val)||![0,1,2].includes(action.choice))throw Error('Saisir un nombre et choisir une justification.');rec.value=String(action.value).slice(0,40);rec.choice=action.choice;rec.work=String(action.work||'').slice(0,1500);rec.tries++;rec.numeric=closeAnswer(val,m.answer);rec.reason=action.choice===0;if(rec.numeric&&rec.reason)rec.done=true;else rec.errors++;}
else throw Error('Action inconnue.');s.updated=new Date().toISOString();return s;}
function graph(m){const W=600,H=150,P=25,sh=m.shape,N=80;let vals=Array.from({length:N+1},(_,k)=>{const t=sh.T*k/N;return sh.kind==='line'?sh.a*t+sh.b:sh.kind==='step'?(t<2?sh.a:sh.b):sh.kind==='exp'?sh.a*Math.exp(-t/sh.tau):sh.kind==='log'?sh.a/(t+1):sh.kind==='charge'?sh.a*(1-Math.exp(-t/sh.tau)):sh.a*Math.sin(sh.w*t);});let lo=Math.min(0,...vals),hi=Math.max(...vals,1),y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P),pts=vals.map((v,k)=>`${P+k/N*(W-2*P)},${y(v)}`).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Allure indicative du signal sur l’intervalle étudié"><line x1="${P}" x2="${W-P}" y1="${y(0)}" y2="${y(0)}" stroke="currentColor" opacity=".3"/><polyline points="${pts}" fill="none" stroke="#1bbfa0" stroke-width="3"/><text x="${P}" y="${H-3}" fill="currentColor" font-size="12">0</text><text x="${W-P-20}" y="${H-3}" fill="currentColor" font-size="12">t (s)</text></svg>`;}

/* Rendu MathML natif : aucune police ni bibliothèque externe. */
function mathEscape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mathExpression(source){
 const tokens=String(source).match(/\d+(?:[.,]\d+)?|sin|cos|ln|eff|moy|[A-Za-zÀ-ÿα-ωΑ-Ω]|[^\s]/gu)||[];let p=0;
 const row=xs=>xs.length===1?xs[0]:'<mrow>'+xs.join('')+'</mrow>';
 function atom(){let t=tokens[p++];if(t===undefined)return '<mrow></mrow>';let out;
  if(t==='('||t==='['){const end=t==='('?')':']',inside=expr(end);if(tokens[p]===end)p++;out='<mrow><mo>'+mathEscape(t)+'</mo>'+inside+'<mo>'+end+'</mo></mrow>'}
  else if(t==='√')out='<msqrt>'+atom()+'</msqrt>';
  else if(/^\d/.test(t))out='<mn>'+mathEscape(t)+'</mn>';
  else if(/^[A-Za-zÀ-ÿα-ωΑ-Ω]+$/u.test(t))out='<mi'+(['sin','cos','ln'].includes(t)?' mathvariant="normal"':'')+'>'+mathEscape(t)+'</mi>';
  else out='<mo>'+mathEscape(t==='-'?'−':t)+'</mo>';
  while(['²','³','^','_','′','₀'].includes(tokens[p])){const op=tokens[p++];if(op==='′')out='<msup>'+out+'<mo>′</mo></msup>';else if(op==='₀')out='<msub>'+out+'<mn>0</mn></msub>';else if(op==='²'||op==='³')out='<msup>'+out+'<mn>'+(op==='²'?2:3)+'</mn></msup>';else{let power;if(tokens[p]==='('){p++;power=expr(')');if(tokens[p]===')')p++}else power=atom();out=(op==='_'?'<msub>':'<msup>')+out+power+(op==='_'?'</msub>':'</msup>')}}return out;
 }
 function product(end){let parts=[];while(p<tokens.length&&tokens[p]!==end&&!['+','−','-','='].includes(tokens[p])){if(tokens[p]==='/'){p++;const numerator=row(parts);parts=['<mfrac>'+numerator+atom()+'</mfrac>']}else parts.push(atom())}return row(parts)}
 function expr(end){const parts=[];while(p<tokens.length&&tokens[p]!==end){if(['+','−','-','='].includes(tokens[p])){parts.push('<mo>'+mathEscape(tokens[p++].replace('-','−'))+'</mo>')}else parts.push(product(end))}return row(parts)}
 return expr();
}
function mathWrap(content,label=''){return '<math xmlns="http://www.w3.org/1998/Math/MathML"'+(label?' aria-label="'+mathEscape(label)+'"':'')+'>'+content+'</math>'}
function mathIntegral(lower,upper,integrand){return '<mrow><msubsup><mo>∫</mo>'+mathExpression(lower)+mathExpression(upper)+'</msubsup>'+mathExpression(integrand)+'<mspace width="0.2em"/><mi mathvariant="normal">d</mi><mi>t</mi></mrow>'}
function mathNotation(value){let s=String(value),fragments=[];const keep=html=>'\u0000'+(fragments.push(html)-1)+'\u0000';
 // Cas de la valeur efficace : racine, fraction et intégrale dans une même formule.
 s=s.replace(/I_eff = √\[\(1\/T\) ∫ de 0 à T de i²\(t\) dt\]/g,()=>keep(mathWrap('<mrow><msub><mi>I</mi><mi mathvariant="normal">eff</mi></msub><mo>=</mo><msqrt><mrow><mfrac><mn>1</mn><mi>T</mi></mfrac>'+mathIntegral('0','T','i²(t)')+'</mrow></msqrt></mrow>','I efficace égale la racine carrée de la moyenne du carré du courant')));
 s=s.replace(/∫ de ([^ ]+) à ([^ ]+) de (.+?) dt/g,(_,a,b,f)=>keep(mathWrap(mathIntegral(a,b,f),`Intégrale de ${a} à ${b} de ${f} par rapport à t`)));
 s=s.replace(/∫₀² ([^ ]+) dt/g,(_,f)=>keep(mathWrap(mathIntegral('0','2',f))));
 s=s.replace(/∫₂⁵ ([^ ]+) dt/g,(_,f)=>keep(mathWrap(mathIntegral('2','5',f))));
 s=s.replace(/\[([^\[\]]+)\] de 0 à ([^ ,;.]+)/g,(_,f,b)=>keep(mathWrap('<mrow><msubsup><mrow><mo>[</mo>'+mathExpression(f)+'<mo>]</mo></mrow><mn>0</mn>'+mathExpression(b)+'</msubsup></mrow>')));
 s=s.replace(/e\^\(([^()]+)\)/g,(_,power)=>keep(mathWrap('<msup><mi mathvariant="normal">e</mi>'+mathExpression(power)+'</msup>')));
 s=s.replace(/(?:\d+|[A-Za-zωτ])\/\(t \+ 1\)(?:²)?/g,f=>keep(mathWrap(mathExpression(f))));
 s=s.replace(/(?:−?[A-Za-z]|−?\d+(?:[.,]\d+)?|[A-Za-z]²)\/(?:√2|\d+|[A-Za-zωτ])/g,f=>keep(mathWrap(mathExpression(f))));
 s=s.replace(/I_(eff|moy)/g,(_,sub)=>keep(mathWrap('<msub><mi>I</mi><mi mathvariant="normal">'+sub+'</mi></msub>')));
 return mathEscape(s).replace(/\u0000(\d+)\u0000/g,(_,i)=>fragments[Number(i)]);
}
function plainMath(s){const sup={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','−':'⁻','-':'⁻','+':'⁺','t':'ᵗ','/':'⁄'};return String(s).replace(/e\^\(([^()]+)\)/g,(_,power)=>'e'+Array.from(power,c=>sup[c]||c).join('')).replace(/I_eff/g,'Iₑff').replace(/I_moy/g,'Iₘₒᵧ');}

async function api(path,body,auth=true){const headers={'Content-Type':'application/json'};if(auth&&credentials)headers.Authorization='Bearer '+credentials.code+':'+credentials.key;const res=await fetch(API_ORIGIN+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,credentials:'include'});let d;try{d=await res.json()}catch{throw Error('Le service de suivi est indisponible. Réessayez.')}if(!res.ok)throw Error(d.error||'Action impossible.');return d}

function home(){screen(`<div class="grid"><section class="hero"><div class="eyebrow">Serious game · Maintenance électrique</div><h1>Rallumez le réseau.<br>Maîtrisez l’intégrale.</h1><p class="muted">Une panne a immobilisé le micro-réseau de l’atelier. Réétalonnez les capteurs, contrôlez les charges et validez l’énergie avant la remise en service.</p><div><span class="tag">2 parcours BTS</span><span class="tag">6 missions par parcours</span><span class="tag">Note sur 20</span></div><div class="circuit" aria-hidden="true"><svg viewBox="0 0 560 140" fill="none" stroke="currentColor" stroke-width="2"><path d="M25 70H90l15-20 22 40 22-40 22 40 15-20H270M270 25v90M285 45v50M285 70H370"/><rect x="370" y="45" width="75" height="50" rx="9"/><path d="M445 70h80v60H25V70"/><circle cx="50" cy="130" r="4" fill="currentColor"/><text x="382" y="78" fill="currentColor" stroke="none" font-size="22">∫ i dt</text></svg></div><p class="small muted">Prévoyez 35 à 50 minutes par parcours. Aucune limite de temps. Prenez un brouillon et une calculatrice en mode radians pour les sinus.</p></section><section><div class="card"><h2>Rejoindre votre classe</h2><p class="muted small">Votre enseignant vous remet un code de classe et une clé élève personnelle courte. Aucun compte élève n’est nécessaire.</p><form onsubmit="event.preventDefault();join()"><label for="classCode">Code de classe</label><input id="classCode" autocomplete="off" required maxlength="20" placeholder="Code remis par l’enseignant" value="${esc(credentials?.code||'')}"><label for="studentKey">Clé élève personnelle</label><input id="studentKey" type="password" autocomplete="off" required maxlength="64" placeholder="Ex. K7MP-4R8T" aria-describedby="keyHelp" value="${esc(credentials?.key||'')}"><p id="keyHelp" class="muted small">8 caractères. Majuscules ou minuscules ; tiret et espaces facultatifs.</p><button class="primary wide" data-action style="margin-top:20px" ${online?'':'disabled'}>Accéder à mon parcours</button></form>${online?'':`<p class="notice">Fichier hors connexion : utilisez le mode entraînement ci-dessous.</p>`}</div><div class="card"><h2>Entraînement libre</h2><p class="muted small">Pour découvrir le jeu sans classe. Les résultats restent sur cet ordinateur et peuvent être exportés.</p><div class="row"><button onclick="practice(1)">BTS 1re année</button><button onclick="practice(2)">BTS 2e année</button></div></div></section></div>`,'home')}
function join(){run(async()=>{const c={code:$('#classCode').value.trim().toUpperCase(),key:$('#studentKey').value.toUpperCase().replace(/[\s-]/g,'')};const prev=credentials;credentials=c;try{student=await api('/api/student');writeLocal('mi-credentials-v1',c);studentHome()}catch(e){credentials=prev;throw e}})}
function studentHome(){screen(`<div class="eyebrow">${esc(student.className)} · ${esc(student.name)}</div><h1>Votre atelier de mission</h1><p class="muted">La progression et la note sont enregistrées en ligne après chaque action validée.</p><div class="two">${[1,2].map(l=>`<div class="card"><h2>BTS ${l===1?'1re':'2e'} année</h2><p>${l===1?'Primitives polynomiales, condition initiale, charge, énergie et valeur moyenne.':'Exponentielle, logarithme, sinus, valeur efficace et énergie d’un condensateur.'}</p><button class="primary" data-action onclick="startOnline(${l})">Nouvelle partie</button></div>`).join('')}</div>${historyTable(student.sessions,true)}<div class="toolbar"><button onclick="downloadStudent()">Télécharger mon bilan</button><button onclick="logout()">Quitter cet accès élève</button></div>`,'student')}

function practice(l){student=null;state=null;const pending=localSessions.filter(s=>s.level===l&&progress(s)<6).at(-1);if(pending){state=pending;game();return}newPractice(l)}

function game(feedback=''){if(!state)return home();const s=state,i=s.index,rec=s.records[i],ms=missions(s.level,s.seed),m=ms[i];screen(`<div class="row" style="justify-content:space-between;margin-bottom:25px"><div><div class="eyebrow">${student?esc(student.name):'Entraînement libre'} · BTS ${s.level===1?'1re':'2e'} année</div><p class="muted small">${student?'Suivi en ligne actif':'Sauvegarde locale uniquement'} · Partie ${String(s.seed).slice(-6)}</p></div><div><span class="score">${fmt(mark(s))}</span> /20 <span class="muted small">${progress(s)<6?'provisoire':''}</span></div></div><div class="game"><aside><h2>Remise en service</h2><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${progress(s)}" aria-label="Missions terminées"><div style="width:${progress(s)/6*100}%"></div></div><div class="rail">${ms.map((x,n)=>`<button class="${n===i?'active':''}" ${n>progress(s)?'disabled':''} onclick="navigateMission(${n})">${s.records[n].done?'✓':'0'+(n+1)} · ${esc(x.title)}</button>`).join('')}</div><p class="muted small">${progress(s)}/6 missions terminées.<br>Chaque mission : 10 points.<br>Note finale = points ÷ 3.</p><details><summary>Barème et aides</summary><p class="small muted">Résultat : 6 points ; justification choisie : 4 points. Chaque indice coûte 2 points (2 indices maximum). Chaque essai incorrect coûte 1 point, dans la limite de 2 points. Afficher la correction avant réussite clôt la mission à 0 point. Une mission est validée quand résultat et justification sont tous deux corrects.</p></details><button class="quiet" onclick="${student?'studentHome()':'home()'}">Quitter la mission</button></aside><section><div class="card"><div class="eyebrow">Mission ${i+1}/6 · ${esc(m.skill)}</div><h2 style="margin-top:12px">${esc(m.title)}</h2><p>${mathNotation(m.context)}</p><figure class="signal">${graph(m)}<figcaption>Allure indicative du signal étudié ; utilisez les données de l’énoncé pour calculer.</figcaption></figure><p class="question">${mathNotation(m.question)}</p>${rec.done?correction(m,rec):`<form onsubmit="event.preventDefault();answer()"><label for="value">Votre résultat ${m.unit?'(en '+m.unit+')':''}</label><input id="value" inputmode="decimal" autocomplete="off" value="${esc(rec.value)}" placeholder="Nombre ; virgule ou point acceptés" required aria-describedby="precision"><p id="precision" class="muted small">Tolérance absolue : 0,005. Saisir uniquement un nombre, sans unité ; les écritures comme 1e−3 se saisissent 1e-3.</p><fieldset style="border:0;padding:0;margin:20px 0"><legend>Choisissez la justification qui valide votre méthode.</legend>${optionOrder().map(n=>`<label class="option"><input type="radio" name="reason" value="${n}" ${rec.choice===n?'checked':''} required><span>${mathNotation(m.options[n])}</span></label>`).join('')}</fieldset><label for="work">Votre démarche au brouillon numérique (facultatif)</label><textarea id="work" maxlength="1500" placeholder="Primitive utilisée, calcul aux bornes, unité…">${esc(rec.work)}</textarea><p class="small muted">Ce texte est transmis à l’enseignant en mode classe. La note automatique porte sur le résultat et le choix de justification ; le texte libre n’est pas noté automatiquement.</p><button class="primary" data-action>Valider résultat et justification</button></form>`}${feedback?`<div class="notice feedback" role="status">${feedback}</div>`:''}${rec.hints?`<div class="notice feedback"><strong>Indices consultés</strong>${m.hints.slice(0,rec.hints).map(h=>`<p>${mathNotation(h)}</p>`).join('')}</div>`:''}<div class="toolbar">${!rec.done?`<button data-action onclick="hint()" ${rec.hints>=2?'disabled':''}>Indice ${Math.min(2,rec.hints+1)}/2 (−2 pts)</button><button onclick="revealPrompt()">Consulter la correction (0 pt)</button>`:`<button class="primary" onclick="nextMission()">${progress(s)===6?'Voir le bilan':i<5?'Mission suivante':'Voir le bilan'}</button>`}<button onclick="exportCurrent()">Télécharger le bilan</button></div></div></section></div>`,'game')}
function correction(m,r){return `<div class="notice ${r.revealed?'':'good'}"><strong>${r.revealed?'Mission étudiée avec correction':'Mission validée'} · ${missionScore(r)}/10</strong><p>${mathNotation(m.solution)}</p><p><strong>Justification :</strong> ${mathNotation(m.options[0])}</p><p class="small">${r.tries} essai(s) · ${r.hints} indice(s) · ${r.errors} essai(s) incorrect(s).</p></div>`}
async function applyAction(a){if(student){const d=await api('/api/action',{sessionId:state.id,index:state.index,action:a});student=d;state=student.sessions.find(x=>x.id===state.id)}else{act(state,a);savePractice()}}

function exportCSV(){const rows=[['Classe','Élève','Parcours','Début','Progression','Note /20','État','Indices','Essais incorrects']];for(const st of classData.students)for(const s of st.sessions)rows.push([classData.name,st.name,'BTS '+s.level,s.started,progress(s)+'/6',String(mark(s)).replace('.',','),progress(s)===6?'Finale':'Provisoire',s.records.reduce((n,r)=>n+r.hints,0),s.records.reduce((n,r)=>n+r.errors,0)]);download('notes-integrales.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function exportRoster(){const rows=[['Classe','Code de classe','Élève','Clé personnelle','Lien du jeu'],...classData.students.map(s=>[classData.name,classData.code,s.name,s.key,location.origin+location.pathname])];download('acces-eleves-a-distribuer-individuellement.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function drawClass(){const d=classData,all=d.students.flatMap(s=>s.sessions),done=all.filter(s=>progress(s)===6);screen(`<div class="eyebrow">Suivi enseignant · ${esc(d.name)}</div><h1>La progression de votre classe</h1><p class="muted">Code de classe : <code>${esc(d.code)}</code> · Dernière actualisation : <span id="lastRefresh">${new Date().toLocaleTimeString('fr-FR')}</span> · actualisation toutes les 15 s.</p><div class="row" style="margin-bottom:25px"><div class="stat"><strong>${d.students.length}</strong>Élèves inscrits</div><div class="stat"><strong>${all.length}</strong>Parties commencées</div><div class="stat"><strong>${done.length}</strong>Parcours terminés</div><div class="stat"><strong>${done.length?fmt(done.reduce((n,s)=>n+mark(s),0)/done.length):'—'}</strong>Moyenne des parties terminées /20</div></div><div class="card"><div class="row" style="justify-content:space-between"><h2>Élèves et évolution</h2><div class="row"><button data-action onclick="refreshClass()">Actualiser</button><button onclick="exportCSV()">Exporter les notes CSV</button></div></div><p class="small muted">Les notes provisoires comptent les missions restantes à zéro. L’évolution se compare à l’intérieur d’un même parcours. Chaque barre représente une partie terminée ; hauteur maximale : 20.</p><div id="studentRows">${studentRows()}</div></div><div class="grid"><form class="card" onsubmit="event.preventDefault();addStudents()"><h2>Ajouter des élèves</h2><label for="names">Un identifiant pédagogique par ligne (60 maximum à la fois)</label><textarea id="names" required maxlength="4000" placeholder="BTS01\nBTS02\nBTS03"></textarea><p class="small muted">Conservez la correspondance avec les noms dans votre propre liste de classe.</p><button class="primary" data-action>Créer les accès individuels</button></form><div class="card"><h2>Distribuer le jeu</h2><ol><li>Publiez le lien du jeu dans Classroom.</li><li>Donnez le code de classe à votre groupe.</li><li>Transmettez à chaque élève uniquement sa clé personnelle.</li></ol><p class="small muted">Clés courtes de 8 caractères, présentées en deux groupes de quatre, sans 0, O, 1, I ni L.</p><button onclick="exportRoster()">Télécharger les accès élèves</button>${classData.students.some(s=>s.key.replace(/-/g,'').length===20)?'<button data-action onclick="simplifyKeys()">Simplifier les anciennes clés</button>':''}<p class="small muted">Le fichier des accès est réservé à l’enseignant. Les élèves ne peuvent consulter que leurs propres parties.</p></div></div><div class="toolbar"><button onclick="teacher()">Mes classes</button><button onclick="guide()">Guide enseignant</button><button onclick="deleteClassPrompt()">Supprimer cette classe</button></div>`,'class');poll=setInterval(async()=>{if(view!=='class'||busy||document.hidden)return;try{await loadClass(selectedClass);if(view==='class'){$('#studentRows').innerHTML=studentRows();$('#lastRefresh').textContent=new Date().toLocaleTimeString('fr-FR')}}catch{say('Suivi non actualisé : vérifiez la connexion puis cliquez sur Actualiser.')}},15000)}
function studentRows(){if(!classData.students.length)return '<p class="muted">Ajoutez vos premiers élèves ci-dessous.</p>';return `<div class="scroll"><table><thead><tr><th>Élève</th><th>Parcours</th><th>Progression et note</th><th>Évolution des notes finales</th><th>Détail</th></tr></thead><tbody>${classData.students.map(st=>{const last=st.sessions.at(-1);return `<tr><td><strong>${esc(st.name)}</strong></td><td>${last?'BTS '+last.level:'—'}</td><td>${last?`${progress(last)}/6 · <strong>${fmt(mark(last))}/20</strong><br><span class="small muted">${progress(last)===6?'Finale':'Provisoire'} · ${esc(date(last.updated))}</span>`:'Pas encore commencé'}</td><td>${[1,2].map(l=>{const ss=st.sessions.filter(s=>s.level===l&&progress(s)===6);return ss.length?`<span class="small">BTS ${l} : ${ss.map(s=>fmt(mark(s))).join(' · ')}</span><div class="spark" role="img" aria-label="Notes successives BTS ${l} : ${ss.map(s=>fmt(mark(s))).join(', ')}">${ss.slice(-12).map(s=>`<i title="${fmt(mark(s))}/20 · ${esc(date(s.started))}" style="height:${Math.max(2,mark(s)/20*60)}px"></i>`).join('')}</div>`:''}).join('')||'—'}</td><td><button onclick="studentDetail('${esc(st.id)}')">Voir</button></td></tr>`}).join('')}</tbody></table></div>`}
function simplifyKeys(){run(async()=>{const result=await api('/api/class/'+selectedClass+'/simplify-keys',{},false);await loadClass(selectedClass);drawClass();say(result.changed+' clé(s) simplifiée(s). Les parties et notes sont conservées. Téléchargez la nouvelle liste des accès.')})}
function refreshClass(){run(async()=>{await loadClass(selectedClass);drawClass()})}
function addStudents(){run(async()=>{const names=$('#names').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);await api('/api/class/'+selectedClass+'/students',{names},false);await loadClass(selectedClass);drawClass();say('Accès élèves créés. Téléchargez-les et distribuez chaque clé individuellement.')})}
function studentDetail(id){const st=classData.students.find(s=>s.id===id);screen(`<div class="eyebrow">${esc(classData.name)} · Détail élève</div><h1>${esc(st.name)}</h1><p>Clé personnelle à transmettre uniquement à cet élève : <code>${esc(st.key)}</code></p>${historyTable(st.sessions)}${st.sessions.slice().reverse().map(s=>`<div class="card"><h2>BTS ${s.level} · ${fmt(mark(s))}/20 ${progress(s)<6?'provisoire':''}</h2><p class="muted small">${esc(date(s.started))} · ${progress(s)}/6 missions</p>${missions(s.level,s.seed).map((m,i)=>{const r=s.records[i];return `<details><summary>${i+1}. ${esc(m.skill)} · ${r.done?missionScore(r):0}/10 · ${r.tries} essai(s) · ${r.hints} indice(s)</summary><p>${mathNotation(m.context)}</p><p>${mathNotation(m.question)}</p><p>Dernière réponse : ${esc(r.value)} ${m.unit}<br>Justification choisie : ${r.choice>=0?mathNotation(m.options[r.choice]):'Aucune'}<br>Démarche : ${esc(r.work||'Non renseignée')}</p><p>${r.revealed?'Correction consultée avant réussite.':r.done?'Réussite.':'En cours.'}</p>${r.done?`<p>${mathNotation(m.solution)}</p>`:''}</details>`}).join('')}</div>`).join('')}<button onclick="openClass('${esc(selectedClass)}')">Retour au suivi</button>`,'detail')}
function guide(){screen(`<div class="eyebrow">Guide enseignant & élèves</div><h1>Une séance prête à jouer.</h1><div class="card"><h2>Déroulement conseillé</h2><p>Public : étudiants de BTS à dominante technique ou électrique. L’affectation 1re/2e année est une progression pédagogique proposée, à ajuster au référentiel de votre spécialité. Les modèles électriques sont idéalisés et leurs formules sont fournies.</p><ol><li><strong>5 min :</strong> présenter le micro-réseau, rappeler les unités et distribuer les accès.</li><li><strong>30 à 40 min :</strong> travail individuel sur ordinateur, brouillon et calculatrice autorisés. Chaque mission demande un calcul puis le choix d’une justification.</li><li><strong>10 min :</strong> mise en commun sur les primitives, les bornes, les constantes et les unités.</li><li><strong>Séance suivante :</strong> rejouer avec de nouvelles données et comparer les résultats d’un même parcours.</li></ol></div><div class="two"><div class="card"><h2>BTS 1re année</h2><p>Prérequis : dérivation des polynômes, calcul littéral simple et unités électriques.</p><ol><li>Reconnaître une primitive polynomiale.</li><li>Fixer la constante par une condition initiale.</li><li>Calculer une charge par intégration.</li><li>Intégrer une puissance pour obtenir une énergie.</li><li>Calculer une valeur moyenne.</li><li>Décomposer une intégrale par morceaux.</li></ol></div><div class="card"><h2>BTS 2e année</h2><p>Prérequis : intégrales définies, exponentielle, logarithme, sinus/cosinus et dérivation composée.</p><ol><li>Primitive d’une exponentielle composée.</li><li>Charge d’un courant exponentiel.</li><li>Intégration avec un logarithme.</li><li>Intégration d’un sinus en radians.</li><li>Valeur efficace à partir de l’intégrale de i².</li><li>Énergie du condensateur via u·u′.</li></ol></div></div><div class="card"><h2>Note automatique sur 20</h2><p>Six missions de 10 points, soit 60 points. <strong>Note = somme des points ÷ 3</strong>, arrondie au centième. Par mission : résultat numérique 6 points, justification choisie 4 points. La mission se valide lorsque les deux sont corrects. Un indice retire 2 points, avec deux indices maximum. Un essai incorrect retire 1 point, avec une pénalité d’essais plafonnée à 2 points. Le score ne descend jamais sous zéro. Afficher la correction avant réussite termine la mission à zéro et débloque la suite.</p><p>Exemple : 10 + 8 + 9 + 6 + 10 + 5 = 48 points, donc <strong>16/20</strong>. Avant la fin, les missions non terminées comptent à zéro : la note affichée est explicitement provisoire.</p><p>Le brouillon libre est lisible par l’enseignant mais n’est pas analysé automatiquement. Le jeu vise l’évaluation formative : le code et les corrections peuvent être inspectés dans le navigateur. Pour une note certificative, compléter par une vérification de la démarche par l’enseignant.</p></div><div class="card"><h2>Créer la classe, suivre et rejouer</h2><ol><li>Dans l’espace enseignant, se connecter avec ChatGPT, puis créer une classe.</li><li>Ajouter un identifiant pédagogique par élève ; télécharger la liste des accès.</li><li>Dans Classroom, créer un devoir et y joindre le lien du jeu. Donner à chaque élève sa clé de manière individuelle.</li><li>Ouvrir le suivi : progression, note provisoire/finale et détails par compétence. L’écran de classe s’actualise toutes les 15 secondes tant qu’il est ouvert.</li><li>Exporter les notes au format CSV si nécessaire. Aucune synchronisation automatique vers le carnet de notes Classroom n’est incluse.</li></ol><p>Le bouton « Nouvelle partie » crée des données renouvelées et conserve l’historique. La comparaison des notes se fait entre parties terminées d’un même parcours ; une hausse ne suffit pas à elle seule à démontrer la maîtrise.</p><p>En mode classe, l’enregistrement en ligne est confirmé après chaque réponse, indice ou correction. En cas de coupure, réessayer une fois la connexion rétablie. Le fichier HTML autonome offre un entraînement local et un bilan texte, sans suivi centralisé.</p></div><div class="card"><h2>Données et accès</h2><p>Utiliser de préférence des pseudonymes ou identifiants pédagogiques. Le jeu conserve les identifiants, parties, réponses, brouillons, indices et notes. Les résultats d’une classe sont accessibles au compte enseignant qui l’a créée. Les nouvelles clés comportent 8 caractères, affichés en deux groupes de quatre. Les clés anciennes peuvent être simplifiées depuis le suivi de classe ; leurs accès restent valables afin de préserver les connexions en cours. La clé personnelle donne accès aux seules parties de son élève : elle doit rester confidentielle. Sur un poste partagé, utiliser « Quitter cet accès élève » en fin de séance.</p><p>Les sessions de formation sont conservées tant que la classe existe. L’enseignant peut supprimer une classe et toutes ses données depuis son tableau de bord. Exporter les résultats utiles avant la suppression.</p></div><div class="toolbar"><button onclick="window.print()">Imprimer ce guide</button><button onclick="home()">Revenir à l’accueil</button></div>`,'guide')}
function deleteClassPrompt(){screen(`<div class="card"><h1>Supprimer la classe</h1><p>Cette action supprime définitivement les accès élèves et toutes les parties de <strong>${esc(classData.name)}</strong>. Exportez vos notes avant de continuer.</p><form onsubmit="event.preventDefault();deleteClassNow()"><label for="deleteCode">Retaper le code ${esc(selectedClass)} pour confirmer</label><input id="deleteCode" autocomplete="off" required><div class="toolbar"><button data-action>Supprimer définitivement</button><button type="button" onclick="openClass('${esc(selectedClass)}')">Annuler</button></div></form></div>`,'delete')}
function deleteClassNow(){run(async()=>{await api('/api/class/'+selectedClass+'/delete',{confirm:$('#deleteCode').value.trim().toUpperCase()},false);say('Classe supprimée.');busy=false;await teacher()})}
if(new URLSearchParams(location.search).has('teacher'))teacher();else home();
</script></body></html>
